<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Mining Visualizer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 40px; }
        .block { background: #1e1e1e; border: 2px solid #333; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .mining { border-color: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        button { background: #007bff; color: white; padding: 10px 25px; border: none; border-radius: 4px; cursor: pointer; }
        pre { background: #000; padding: 10px; color: #00ff00; }
    </style>
</head>
<body>
    <h1>⛓️ Blockchain Miner Visualizer</h1>
    <p>Difficulty is set to 4 (requires hash to start with "0000")</p>
    <button id="mineBtn">Mine New Block</button>
    <div id="chain"></div>

    <script>
        // Browser-friendly hashing (using SubtleCrypto)
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        let chain = [{ index: 0, hash: "0000genesis", nonce: 0 }];

        async function mineNewBlock() {
            const btn = document.getElementById('mineBtn');
            btn.disabled = true;
            
            const index = chain.length;
            const prevHash = chain[chain.length - 1].hash;
            let nonce = 0;
            let hash = "";

            const display = document.createElement('div');
            display.className = "block mining";
            document.getElementById('chain').prepend(display);

            // Mining Simulation
            while (!hash.startsWith("0000")) {
                nonce++;
                hash = await sha256(index + prevHash + nonce);
                display.innerHTML = `<h3>Mining Block #${index}...</h3><p>Current Nonce: ${nonce}</p><pre>${hash}</pre>`;
                if (nonce % 100 === 0) await new Promise(r => setTimeout(r, 1)); // Yield for UI
            }

            display.className = "block";
            chain.push({ index, hash, nonce });
            btn.disabled = false;
        }

        document.getElementById('mineBtn').onclick = mineNewBlock;
    </script>
</body>
</html>
